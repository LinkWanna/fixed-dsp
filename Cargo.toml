[package]
name = "fixed-dsp"
version = "0.2.1"
description = "A Rust library for fixed-point digital signal processing (DSP) algorithms."
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/LinkWanna/fixed-dsp"
homepage = "https://github.com/LinkWanna/fixed-dsp"
documentation = "https://docs.rs/fixed-dsp"
keywords = ["dsp", "fixed-point", "embedded", "signal-processing"]
categories = ["embedded", "no-std", "algorithms"]
build = "build.rs"
include = [
	"src/**",
	"Cargo.toml",
	"build.rs",
	"README.md",
	"README_zh.md",
]

[features]
default = []

# library user should not enable this feature, it's only for internal use in integration tests
difftest = []

[dependencies]

[build-dependencies]
cc = "1"
